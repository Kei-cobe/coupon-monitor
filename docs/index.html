<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>优惠速查</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#20211f;--muted:#74776f;--line:#e5e0d7;
  --brand:#c8542b;--soft:#fbe9df;--green:#2f7d4f;--green-soft:#e6f3ea;
  --amber:#9a6a12;--amber-soft:#fbf0d8;--blue:#2e5f8a;--blue-soft:#e6eef7;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
.wrap{max-width:780px;margin:0 auto;padding:18px 14px 48px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:20px;margin:0}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:#eeece8;color:#6d7067;font-weight:600}
.pill.ok{background:var(--green-soft);color:var(--green)}
#btnSettings{margin-left:auto;padding:7px 12px;font-size:13px}
.hint{color:var(--muted);font-size:12.5px;margin:8px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:11px 14px;border-radius:10px;cursor:pointer}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.panel label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.panel input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fdfcf9}
.progress{height:8px;background:#ebe6dd;border-radius:999px;overflow:hidden;margin:4px 0 8px}
.progress i{display:block;height:100%;width:0;background:var(--brand);transition:width .4s}
.progress.busy i{width:100%;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.status{color:var(--muted);font-size:13px;min-height:22px;margin-bottom:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0}
.filters input{flex:1 1 150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
h3{margin:0 0 6px;font-size:15.5px;line-height:1.45}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.badge{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#f1ede6;color:#5c5f57;font-weight:600}
.badge.active{background:var(--green-soft);color:var(--green)}
.badge.upcoming{background:var(--blue-soft);color:var(--blue)}
.badge.unknown{background:var(--amber-soft);color:var(--amber)}
.badge.expired{background:#eeece8;color:#8a8d84}
.badge.free,.badge.bogo,.badge.big_coupon{background:var(--soft);color:#9a3d1c}
.badge.low_price{background:var(--green-soft);color:var(--green)}
.badge.collab{background:#efe7f8;color:#6a4a94}
.meta{color:var(--muted);font-size:12.5px}
.summary{margin:6px 0;color:#4a4d46;font-size:13.5px}
a{color:var(--brand);font-size:13px;text-decoration:none;word-break:break-all}
details{margin-top:8px;font-size:13.5px;color:#4a4d46}
summary{cursor:pointer;color:var(--brand)}
details ol{margin:6px 0 0 18px;padding:0}
.empty{color:var(--muted);text-align:center;padding:34px 10px;line-height:1.9}
.foot{color:var(--muted);font-size:12px;line-height:1.8;margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>优惠速查</h1>
    <span class="pill" id="stamp">暂无数据</span>
    <button id="btnSettings">设置</button>
  </header>

  <section class="panel" id="setup" hidden>
    <p class="hint">填写仓库后，这个页面可以直接触发 GitHub Actions 搜索，结果会显示在下方。令牌只保存在你本机浏览器，不会写进仓库。</p>
    <label for="repo">仓库（owner/repo）</label>
    <input id="repo" placeholder="yourname/coupon-monitor" autocomplete="off">
    <label for="token">访问令牌</label>
    <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
    <p class="hint">建议用 Fine-grained PAT：仅选择这个仓库，权限只勾 Actions 的 Read and write，有效期设 7 天。使用后可随时删除令牌。</p>
    <div class="actions">
      <button class="primary" id="btnSave">保存</button>
      <button id="btnClear">清除令牌</button>
    </div>
  </section>

  <div class="actions">
    <button class="primary" id="btnAll">搜索全部</button>
    <button id="btnCoupons">只搜平台券</button>
    <button id="btnBrands">只搜奶茶活动</button>
    <button id="btnReload">刷新数据</button>
  </div>

  <div class="progress" id="progress"><i id="bar"></i></div>
  <div class="status" id="status">正在读取数据…</div>

  <div class="filters">
    <select id="fStatus">
      <option value="">全部状态</option>
      <option value="active">进行中</option>
      <option value="upcoming">即将开始</option>
      <option value="unknown">日期待核验</option>
      <option value="expired">已结束</option>
    </select>
    <select id="fCat">
      <option value="">全部类型</option>
      <option value="free">免单/免费</option>
      <option value="bogo">买一送一</option>
      <option value="second_half">第二杯半价</option>
      <option value="big_coupon">大额券</option>
      <option value="low_price">个位数低价</option>
      <option value="collab">联名/联动</option>
      <option value="coupon">优惠券/红包</option>
    </select>
    <input id="q" placeholder="搜品牌或标题，如：免单">
  </div>

  <div id="list"><div class="empty">正在读取数据…</div></div>

  <p class="foot">
    数据由 GitHub Actions 执行搜索后写入本仓库，页面只做展示。公开搜索仅提供线索，领取前请在官方 App 核验；本工具不会自动领取，也不保存任何平台账号密码。
  </p>
</div>

<script>
const API = "https://api.github.com";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUS_LABEL = {active:"进行中",upcoming:"即将开始",expired:"已结束",unknown:"日期待核验"};
const CAT_LABEL = {free:"免单/免费",bogo:"买一送一",second_half:"第二杯半价",
  big_coupon:"大额券",low_price:"个位数低价",collab:"联名/联动",coupon:"优惠券/红包"};
let data = null, busy = false;

function cfg(){
  return {repo:(localStorage.getItem("coupon_repo")||"").trim(),
          token:(localStorage.getItem("coupon_token")||"").trim()};
}
function setStatus(text, ok){
  $("#status").textContent = text;
  $("#progress").classList.toggle("busy", busy);
  if(!busy) $("#bar").style.width = ok ? "100%" : "0";
}
function setBusy(value){
  busy = value;
  ["btnAll","btnCoupons","btnBrands","btnReload"].forEach(id => $("#"+id).disabled = value);
  $("#progress").classList.toggle("busy", value);
  if(!value) $("#bar").style.width = "100%";
}
function badge(text, cls){ return `<span class="badge ${cls||""}">${esc(text)}</span>`; }

function render(){
  const stamp = $("#stamp");
  if(data && data.generated_at){
    const when = new Date(data.generated_at);
    stamp.textContent = "更新于 " + when.toLocaleString("zh-CN", {month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
    stamp.className = "pill ok";
  }else{
    stamp.textContent = "暂无数据";
    stamp.className = "pill";
  }

  const status = $("#fStatus").value, cat = $("#fCat").value;
  const q = $("#q").value.trim().toLowerCase();
  const all = (data && data.items) || [];
  const items = all.filter(it => {
    if(status && it.status !== status) return false;
    if(cat && !(it.categories || []).includes(cat)) return false;
    if(q){
      const text = (it.target + " " + it.title + " " + (it.summary||"")).toLowerCase();
      if(!text.includes(q)) return false;
    }
    return true;
  });

  if(!all.length){
    $("#list").innerHTML = `<div class="empty">
      还没有数据。<br>
      点右上角“设置”填写仓库和令牌，再点“搜索全部”。<br>
      也可以到 GitHub 仓库的 Actions 页面手动运行一次。</div>`;
    return;
  }
  if(!items.length){
    $("#list").innerHTML = `<div class="empty">当前筛选条件下没有结果。</div>`;
    return;
  }
  $("#list").innerHTML = items.map(it => {
    const badges = [badge(STATUS_LABEL[it.status] || it.status, it.status)]
      .concat((it.categories || []).map(c => badge(CAT_LABEL[c] || c, c)))
      .concat([it.official ? badge("官方来源", "active") : badge("待核验", "unknown")]).join("");
    const facts = [];
    if(it.amount != null) facts.push(`券额/减额约 ${it.amount} 元`);
    if(it.price != null) facts.push(`低价约 ${it.price} 元`);
    if(it.start_date || it.end_date) facts.push(`日期 ${it.start_date || "待确认"} 至 ${it.end_date || "待确认"}`);
    if(it.collab) facts.push(`联动方：${it.collab}`);
    const guide = (data.guides || {})[it.target];
    const steps = guide ? `<details><summary>领取方式</summary>
      <div class="meta">入口：${esc(guide.app_path || "以官方 App 为准")}</div>
      <ol>${(guide.claim_steps || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol></details>` : "";
    return `<article class="card">
      <div class="badges">${badges}</div>
      <h3>${esc(it.target)}｜${esc(it.title)}</h3>
      <div class="meta">${esc(facts.join("；") || "未提取到金额或日期")} · ${esc(it.source)}</div>
      ${it.summary ? `<p class="summary">${esc(it.summary).slice(0,200)}</p>` : ""}
      ${it.link ? `<a href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">打开来源</a>` : ""}
      ${steps}
    </article>`;
  }).join("");
}

async function loadData(){
  setStatus("正在读取数据…");
  try{
    const res = await fetch("./data/latest.json?_=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
    localStorage.setItem("coupon_cache", JSON.stringify(data));
    render();
    setStatus(data.count ? `共有 ${data.count} 条线索。` : "数据文件为空，先执行一次搜索。", true);
  }catch(e){
    const cached = localStorage.getItem("coupon_cache");
    if(cached){
      data = JSON.parse(cached);
      render();
      setStatus("读取线上数据失败，显示本机缓存。", true);
    }else{
      data = null;
      render();
      setStatus("读取数据失败：" + e.message + "。请确认已通过 GitHub Pages 打开本页。");
    }
  }
}

async function gh(path, options = {}){
  const {token} = cfg();
  const headers = Object.assign({"Accept":"application/vnd.github+json"}, options.headers || {});
  if(token) headers.Authorization = "Bearer " + token;
  const res = await fetch(API + path, Object.assign({}, options, {headers}));
  if(!res.ok){
    let detail = res.status;
    try { const body = await res.json(); detail = body.message || detail; } catch(e){}
    throw new Error(detail);
  }
  return res.status === 204 ? null : res.json();
}

async function latestRunId(repo){
  try{
    const body = await gh(`/repos/${repo}/actions/runs?per_page=1`);
    return (body.workflow_runs && body.workflow_runs[0]) ? body.workflow_runs[0].id : 0;
  }catch(e){ return 0; }
}

async function pollRun(repo, before){
  for(let i = 0; i < 90; i++){
    await new Promise(r => setTimeout(r, 4000));
    let runs;
    try{
      const body = await gh(`/repos/${repo}/actions/runs?per_page=5`);
      runs = body.workflow_runs || [];
    }catch(e){ continue; }
    const run = runs.find(r => r.id > before);
    if(!run){ setStatus("已提交，GitHub 排队中…"); continue; }
    if(run.status !== "completed"){
      const label = run.status === "queued" ? "排队中" : "执行中";
      setStatus(`GitHub ${label}… 可稍后刷新数据。`);
      continue;
    }
    if(run.conclusion === "success"){
      await loadData();
      setStatus("搜索完成，数据已更新。", true);
    }else{
      setStatus(`执行结束：${run.conclusion}。请到仓库 Actions 页面查看日志。`);
    }
    return;
  }
  setStatus("等待超时，请稍后点“刷新数据”，或到 Actions 页面查看。");
}

async function dispatch(mode){
  if(busy) return;
  const {repo, token} = cfg();
  if(!repo || !token){
    $("#setup").hidden = false;
    setStatus("请先在设置里填写仓库和令牌。");
    return;
  }
  setBusy(true);
  try{
    setStatus("正在提交任务…");
    const info = await gh(`/repos/${repo}`);
    const ref = info.default_branch || "main";
    const before = await latestRunId(repo);
    const res = await fetch(`${API}/repos/${repo}/actions/workflows/coupon.yml/dispatches`, {
      method:"POST",
      headers:{"Authorization":"Bearer " + token, "Accept":"application/vnd.github+json", "Content-Type":"application/json"},
      body: JSON.stringify({ref, inputs:{mode}})
    });
    if(res.status !== 204){
      let detail = res.status;
      try { const body = await res.json(); detail = body.message || detail; } catch(e){}
      throw new Error(detail);
    }
    setStatus("已提交，等待 GitHub 执行…");
    await pollRun(repo, before);
  }catch(e){
    setStatus("提交失败：" + e.message);
  }finally{
    setBusy(false);
  }
}

$("#btnSettings").onclick = () => {
  const open = $("#setup").hidden;
  $("#setup").hidden = !open;
  if(open){
    $("#repo").value = cfg().repo;
    $("#token").value = "";
    $("#token").placeholder = cfg().token ? "已保存，留空则不修改" : "github_pat_...";
  }
};
$("#btnSave").onclick = () => {
  const repo = $("#repo").value.trim();
  const token = $("#token").value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ setStatus("仓库格式应为 owner/repo。"); return; }
  localStorage.setItem("coupon_repo", repo);
  if(token) localStorage.setItem("coupon_token", token);
  setStatus(cfg().token ? "设置已保存。" : "仓库已保存，还缺令牌。", true);
};
$("#btnClear").onclick = () => {
  localStorage.removeItem("coupon_token");
  setStatus("已清除本机令牌。");
};
$("#btnAll").onclick = () => dispatch("all");
$("#btnCoupons").onclick = () => dispatch("coupons");
$("#btnBrands").onclick = () => dispatch("brands");
$("#btnReload").onclick = loadData;
["fStatus","fCat"].forEach(id => $("#"+id).addEventListener("change", render));
$("#q").addEventListener("input", render);

loadData();
</script>
</body>
</html>
